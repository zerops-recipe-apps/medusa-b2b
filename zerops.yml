# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
#
# Setups are how a service is built — only `dev` and `prod`.
# `*dev` hostnames use `dev` (workspace). `*stage` / `medusa` use `prod`.
# This recipe deploys Medusa only. nextstore/ stays in git for local
# compose; a git-connected `dev` container deploys `./` so a push
# cannot delete the storefront tree.
# Vault keys inject as-is (JWT_SECRET, SMTP_*, STRIPE_*). This file
# only remaps or computes values.

zerops:
  - setup: prod
    build:
      envVariables:
        BACKEND_URL: ${API_URL}
      base: nodejs@24
      buildCommands:
        - cd backend && yarn
        - cd backend && yarn build
        - cd backend && cp -f package.json tsconfig.json .medusa/server/
      # Flattened runtime only — prod is not a git workspace.
      deployFiles:
        - backend/.medusa/server/~
        - backend/~node_modules
      cache:
        - backend/node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 9000
          path: /health
    run:
      base: nodejs@24
      envVariables:
        DATABASE_TYPE: postgres
        NODE_ENV: production
        MEDUSA_DISABLE_TELEMETRY: "true"
        MEDUSA_FF_CACHING: "true"
        BACKEND_URL: ${API_URL}
        STOREFRONT_URL: ${APP_URL}
        STORE_CORS: ${APP_URL},${DEV_APP_URL},http://localhost:8000,http://localhost:5173,http://localhost:3000
        ADMIN_CORS: ${API_URL},${DEV_API_URL},http://localhost:5173,http://localhost:9000
        AUTH_CORS: ${APP_URL},${API_URL},${DEV_APP_URL},${DEV_API_URL},http://localhost:8000,http://localhost:5173,http://localhost:9000
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?sslmode=disable
        MINIO_BUCKET: ${storage_bucketName}
        MINIO_ENDPOINT: ${storage_apiUrl}
        MINIO_SECRET_KEY: ${storage_secretAccessKey}
        MINIO_ACCESS_KEY: ${storage_accessKeyId}
        REDIS_URL: ${redis_connectionString}
        CACHE_REDIS_URL: ${redis_connectionString}
        EVENTS_REDIS_URL: ${redis_connectionString}
        WE_REDIS_URL: ${redis_connectionString}
        LOCKING_REDIS_URL: ${redis_connectionString}
        MEILISEARCH_HOST: http://${search_hostname}:${search_port}
        MEILISEARCH_API_KEY: ${search_masterKey}
        MEILISEARCH_PRODUCT_INDEX_NAME: products
      initCommands:
        - zsc execOnce ${appVersionId}_migration -- yarn migrate
        - zsc execOnce ${appVersionId}_links -- yarn syncLinks
        - zsc execOnce createInitialSuperadmin_v2 -- yarn createInitialSuperadmin
        - zsc execOnce seedInitialData -- yarn seedInitialData
        - yarn setInitialPublishableKey
        - zsc execOnce addInitialSearchDocuments -- yarn addInitialSearchDocuments
      ports:
        - port: 9000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 9000
          path: /health

  # Idle workspace — full repo, no start. SSH in and `cd backend && yarn dev`.
  - setup: dev
    build:
      base: nodejs@24
      envVariables:
        BACKEND_URL: ${DEV_API_URL}
      buildCommands:
        - cd backend && yarn
      deployFiles: ./
      cache:
        - backend/node_modules
    run:
      base: nodejs@24
      envVariables:
        DATABASE_TYPE: postgres
        NODE_ENV: development
        MEDUSA_DISABLE_TELEMETRY: "true"
        MEDUSA_FF_CACHING: "true"
        BACKEND_URL: ${DEV_API_URL}
        STOREFRONT_URL: ${DEV_APP_URL}
        STORE_CORS: ${DEV_APP_URL},${APP_URL},http://localhost:8000,http://localhost:5173,http://localhost:3000
        ADMIN_CORS: ${DEV_API_URL},${API_URL},http://localhost:5173,http://localhost:9000
        AUTH_CORS: ${DEV_APP_URL},${DEV_API_URL},${APP_URL},${API_URL},http://localhost:8000,http://localhost:5173,http://localhost:9000
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?sslmode=disable
        MINIO_BUCKET: ${storage_bucketName}
        MINIO_ENDPOINT: ${storage_apiUrl}
        MINIO_SECRET_KEY: ${storage_secretAccessKey}
        MINIO_ACCESS_KEY: ${storage_accessKeyId}
        REDIS_URL: ${redis_connectionString}
        CACHE_REDIS_URL: ${redis_connectionString}
        EVENTS_REDIS_URL: ${redis_connectionString}
        WE_REDIS_URL: ${redis_connectionString}
        LOCKING_REDIS_URL: ${redis_connectionString}
        MEILISEARCH_HOST: http://${search_hostname}:${search_port}
        MEILISEARCH_API_KEY: ${search_masterKey}
        MEILISEARCH_PRODUCT_INDEX_NAME: products
      ports:
        - port: 9000
          httpSupport: true
